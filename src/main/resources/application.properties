quarkus.log.console.format=%d{HH:mm:ss} [%c{1}] [%X{requestId}] %s%e%n

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=transaction-risk-service
smallrye.jwt.sign.key.location=privateKey.pem

quarkus.log.category."io.smallrye.jwt".level=DEBUG
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG

mastercard.consumer-key=${MC_CONSUMER_KEY}
mastercard.keystore.path=${MC_KEYSTORE_PATH}
mastercard.keystore.alias=${MC_KEYSTORE_ALIAS}
mastercard.keystore.password=${MC_KEYSTORE_PASSWORD}

quarkus.rest-client.mastercard-bin.url=https://sandbox.api.mastercard.com/bin-resources
quarkus.rest-client.mastercard-bin.connect-timeout=2000
quarkus.rest-client.mastercard-bin.read-timeout=3000

quarkus.cache.caffeine."bin-lookup".expire-after-write=5M
quarkus.cache.caffeine."bin-lookup".maximum-size=100

quarkus.log.category."org.kubis".level=DEBUG

#TESTS

%test.quarkus.rest-client.mastercard-bin.url=http://localhost:${quarkus.wiremock.devservices.port}/bin-resources
%test.mastercard.consumer-key=test-consumer-key
%test.mastercard.keystore.path=src/test/resources/test-keystore.p12
%test.mastercard.keystore.alias=keyalias
%test.mastercard.keystore.password=testpass
%test.quarkus.cache.enabled=false

%dev.quarkus.wiremock.devservices.enabled=false
